services:
  # 1. AI 模型引擎
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: always
    volumes:
      - ollama-data:/root/.ollama
    entrypoint: /bin/sh -c "ollama serve & sleep 10 && ollama pull llama3.1 && tail -f /dev/null"
    networks:
      - ai-network
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # 2. 搜尋引擎
  searxng:
    image: searxng/searxng:latest
    container_name: searxng
    restart: always
    user: root
    networks:
      - ai-network
    environment:
      - SEARXNG_BASE_URL=http://searxng:8080
      - SEARXNG_SETTINGS_PATH=/etc/searxng/settings.yml
      - SEARXNG_LIMITER=false
    volumes:
      - ./searxng:/etc/searxng
    ports:
      - "8081:8080"

  # 3. 網頁圖形介面
  open-webui:
    image: ghcr.io/open-webui/open-webui:cuda
    container_name: open-webui
    restart: always
    ports:
      - "3000:8080"
    volumes:
      - open-webui-data:/app/backend/data
    environment:
      - 'OLLAMA_BASE_URL=http://ollama:11434'
      - 'ENABLE_RAG_WEB_SEARCH=True'
      - 'RAG_WEB_SEARCH_ENGINE=searxng'
      - 'RAG_WEB_SEARCH_RESULT_COUNT=3'
      - 'SEARXNG_QUERY_URL=http://searxng:8080/search?q=<query>' # <-- 這裡修正了
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    depends_on:
      - ollama
      - searxng
    networks:
      - ai-network
      
  # 4. 自動更新工具
  watchtower:
    image: containrrr/watchtower
    container_name: watchtower
    restart: always
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: --cleanup --interval 86400
    networks:
      - ai-network # <-- 建議加入

networks:
  ai-network:

volumes:
  ollama-data:
  open-webui-data:
